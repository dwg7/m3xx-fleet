<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>m3xx フリート状態</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/openmct@4.3.1/dist/espressoTheme.css">
  <style>
    html, body { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <script>
    // CDN経由でOpen MCTを読み込むと、検索インデクサがSharedWorkerを自CDNオリジンから
    // 起動しようとしてクロスオリジンエラーになる。事前にundefinedにして同期フォールバックへ倒す。
    window.SharedWorker = undefined;
  </script>
  <script src="https://unpkg.com/openmct@4.3.1/dist/openmct.js"></script>
  <script src="plugins/fleet-provider.js"></script>
  <script>
    openmct.setAssetPath('https://unpkg.com/openmct@4.3.1/dist');
    openmct.install(openmct.plugins.UTCTimeSystem());
    openmct.install(FleetProvider);

    openmct.start();
  </script>
</body>
</html>
